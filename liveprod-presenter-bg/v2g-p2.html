<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>P2 Korrektur</title>
<style>:root{--bg:#05100f;--panel:#0d1f1e;--lime:#b6e84a;--text:#e8f0ee;--muted:#8fa8a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px}h1{font-size:20px;margin:0 0 4px}p.sub{color:var(--muted);margin:0 0 14px;font-size:14px;line-height:1.45}.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}@media(max-width:520px){.grid{grid-template-columns:1fr}body{padding:14px}}figure{margin:0;background:var(--panel);border:1px solid #1c3230;border-radius:14px;overflow:hidden}figure img{display:block;width:100%;height:auto}figcaption{padding:10px 14px;font-size:14px;line-height:1.4}figcaption b{color:var(--lime)}</style></head>

<figure><a href="v2g-p2-2.png"><img src="v2g-p2-2.png" alt="p2-2"></a><figcaption><b>P2 · 2</b> ⭐ — Zertifikat links + Börsenbrief mittig (Text unleserlich), farbige Buchrücken. Balanciert.</figcaption></figure>
