<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter-Backgrounds — Auswahl</title>
<style>
  :root { --bg:#05100f; --panel:#0d1f1e; --teal:#0A1F1F; --lime:#b6e84a; --text:#e8f0ee; --muted:#8fa8a3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px; }
  h1 { font-size:20px; font-weight:650; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  .grid { display:grid; gap:20px; grid-template-columns:repeat(auto-fit,minmax(440px,1fr)); }
  @media (max-width:520px){ .grid{ grid-template-columns:1fr; } body{ padding:14px; } }
  figure { margin:0; background:var(--panel); border:1px solid #1c3230; border-radius:14px; overflow:hidden; }
  figure img { display:block; width:100%; height:auto; }
  figcaption { padding:10px 14px; font-size:14px; }
  figcaption b { color:var(--lime); font-weight:650; }
  .cap-sub { color:var(--muted); font-size:13px; }
  a.full { color:var(--muted); font-size:12px; text-decoration:none; }
</style>
</head>
<body>
  <h1>Presenter-Backgrounds — Kandidaten (Design-A, Trading/Finance-Office)</h1>
  <p class="sub">Naher Backdrop ~2&nbsp;m, Petrol/Teal + Walnuss, photorealistisch. Tippe/klicke ein Bild für Vollansicht. Sag mir deine Favoriten für P1 &amp; P2.</p>
  <div class="grid">
    <figure><a href="variante-1.png"><img src="variante-1.png" alt="Variante 1"></a>
      <figcaption><b>1</b> — Regal mit Pflanzen/Büchern/Globus + dezentes Chart-Bild links</figcaption></figure>
    <figure><a href="variante-2.png"><img src="variante-2.png" alt="Variante 2"></a>
      <figcaption><b>2</b> — Großer unscharfer Chart-Monitor rechts + Regal links</figcaption></figure>
    <figure><a href="variante-3.png"><img src="variante-3.png" alt="Variante 3"></a>
      <figcaption><b>3</b> — Warm/gemütlich, Holz-dominant, Regal + Lampe</figcaption></figure>
    <figure><a href="variante-4.png"><img src="variante-4.png" alt="Variante 4"></a>
      <figcaption><b>4</b> — Petrol-dominant, minimalistisch, Messing + Trading-Glow</figcaption></figure>
    <figure><a href="variante-5.png"><img src="variante-5.png" alt="Variante 5"></a>
      <figcaption><b>5</b> — Symmetrisch, Pflanzen beidseitig, Weltuhren + Bücher</figcaption></figure>
    <figure><a href="variante-6.png"><img src="variante-6.png" alt="Variante 6"></a>
      <figcaption><b>6</b> — Finance-Ecke: offenes Regal + Chart-Monitor + Lampe</figcaption></figure>
  </div>
</body>
</html>
