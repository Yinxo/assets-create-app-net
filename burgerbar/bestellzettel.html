<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>BURGERBAR — Bestellzettel (3×6)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6EEDC; --ink:#2E2218; --soft:#6B5641; --rust:#A14A29; --line:#C9B795; --cut:#B79170;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#cdbfa6; color:var(--ink);
    font-family:'Inter','Segoe UI',Arial,sans-serif;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  @page{ size:A4 portrait; margin:0; }

  .sheet{
    width:210mm; height:297mm; background:var(--paper);
    padding:5mm; display:grid;
    grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(6,1fr);
  }

  .slip{
    border:1px dashed var(--cut);
    margin:-0.5px;                 /* benachbarte Schnittlinien teilen sich */
    padding:2.6mm 3mm;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  .sh{ display:flex; align-items:baseline; justify-content:space-between;
       border-bottom:1px solid var(--line); padding-bottom:.8mm; margin-bottom:1mm; }
  .brand{ font-family:'Yellowtail',cursive; font-size:11pt; line-height:.8; color:var(--rust); }
  .st{ font-size:5.6pt; font-style:italic; color:var(--soft); text-transform:uppercase; letter-spacing:.12em; }

  .line{ font-size:7pt; display:flex; align-items:center; gap:1.4mm; margin-bottom:1mm; }
  .lab{ font-weight:700; font-size:6pt; text-transform:uppercase; letter-spacing:.05em; color:var(--soft); }
  .opt{ display:flex; align-items:center; gap:1mm; font-size:7pt; }

  .gh{ font-weight:700; font-size:6pt; text-transform:uppercase; letter-spacing:.06em;
       color:var(--soft); margin:.4mm 0 .8mm; }
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:.5mm 2mm; }
  .cols label{ font-size:6.6pt; display:flex; align-items:center; gap:1.2mm; line-height:1.2; }

  .cb{ display:inline-block; width:2.5mm; height:2.5mm; border:0.6pt solid var(--ink);
       border-radius:.4mm; flex:0 0 auto; }

  .name{ font-size:6pt; color:var(--soft); margin-top:auto;
         border-top:1px dotted var(--line); padding-top:1mm; }
</style>
</head>
<body>
<div class="sheet">
  <!-- 18× identischer Bestellzettel; template via JS unten geklont -->
</div>
<template id="slip">
  <div class="slip">
    <div class="sh"><span class="brand">Burgerbar</span><span class="st">Bestellzettel</span></div>
    <div class="line"><span class="lab">Größe</span>
      <span class="opt"><span class="cb"></span>Single 125 g</span>
      <span class="opt"><span class="cb"></span>Double 250 g</span>
    </div>
    <div class="gh">Toppings</div>
    <div class="cols">
      <label><span class="cb"></span>Champignons</label>
      <label><span class="cb"></span>Bacon</label>
      <label><span class="cb"></span>Zwiebeln</label>
      <label><span class="cb"></span>Feta</label>
      <label><span class="cb"></span>Tomate/Gurke</label>
      <label><span class="cb"></span>Coleslaw</label>
      <label><span class="cb"></span>Antipasti</label>
      <label><span class="cb"></span>Rucola</label>
      <label><span class="cb"></span>Eisberg</label>
    </div>
    <div class="line" style="margin-top:1mm"><span class="lab">Sauce</span>
      <span class="opt"><span class="cb"></span>Kristin</span>
      <span class="opt"><span class="cb"></span>Buddel</span>
    </div>
    <div class="name">Name / Tisch: ______________</div>
  </div>
</template>
<script>
  const sheet = document.querySelector('.sheet');
  const tpl = document.getElementById('slip');
  for (let i = 0; i < 18; i++) sheet.appendChild(tpl.content.cloneNode(true));
</script>
</body>
</html>
