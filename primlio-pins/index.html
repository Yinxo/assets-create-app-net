<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>primlio · Pinterest-Pin Design-Muster</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#3a2143;color:#faf7f2;font-family:Inter,sans-serif;padding:40px 20px}
  h1{font-family:Fraunces,serif;font-weight:600;text-align:center;font-size:34px;margin:0 0 6px}
  h1 .o{color:#d1652f}
  .sub{text-align:center;color:#e7dcea;max-width:640px;margin:0 auto 40px;line-height:1.5}
  .grid{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;max-width:1500px;margin:0 auto}
  figure{margin:0;width:340px}
  figure img{width:100%;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.35);display:block}
  figcaption{margin-top:14px;font-size:15px;color:#efe7f2}
  figcaption b{color:#f7d9a8;font-weight:600}
</style>
</head>
<body>
<h1>primlio · Pinterest-Pin&nbsp;Muster</h1>
<p class="sub">Vier Layout-Varianten im primlio-Design (Aubergine · Terrakotta · Fraunces), je 1000×1500 (2:3). Alle markenkonsistent, aber unterschiedlich aufgebaut — als Basis für die KI-gesteuerte Varianten-Auswahl.</p>
<div class="grid">
  <figure><img src="pin-A-produkt.png" alt="Variante A"><figcaption><b>A — Produkt · Hero + Marken-Band.</b> Produktfoto + Aubergine-Band mit Titel. Für jedes Produkt (auch ohne KI-Bild).</figcaption></figure>
  <figure><img src="pin-B-ratgeber.png" alt="Variante B"><figcaption><b>B — Ratgeber · Hero + Titel.</b> KI-Hero vollflächig, Verlauf, Titel + Frische-Stempel.</figcaption></figure>
  <figure><img src="pin-C-tipps.png" alt="Variante C"><figcaption><b>C — Stichpunkt-/Tipps-Liste.</b> 5–7 Hinweise mit nummerierten Markern. Informativ, klickstark.</figcaption></figure>
  <figure><img src="pin-D-anekdote.png" alt="Variante D"><figcaption><b>D — Anekdote / „Wusstest du?" / Fakt.</b> Kurze Story/Spruch in Fraunces-Kursiv auf Karte.</figcaption></figure>
</div>
</body>
</html>
