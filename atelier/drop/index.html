<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atelier — Logo Drop</title>
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #111;
      --muted: #666;
      --accent: #ff5a1f;
      --card: #fff;
      --border: #e5e5e5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      padding: 32px 20px 16px;
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: -0.5px;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 8px 20px 40px;
      display: grid;
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: auto;
      display: block;
      background: #f0f0ef;
    }
    .card .meta {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--border);
    }
    .card .meta .label {
      font-size: 14px;
      color: var(--muted);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: var(--fg);
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.96); }
    .btn.secondary {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }
    footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 20px 32px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --fg: #f5f5f5;
        --muted: #888;
        --card: #161616;
        --border: #262626;
      }
      .btn { background: #f5f5f5; color: #0a0a0a; }
      .btn.secondary { color: #f5f5f5; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Atelier — Logo Drop</h1>
    <p>Generiert via Imagen 4 · 2026-05-19 · tap auf Download = direkt ins Geräte-Album / Downloads-Ordner</p>
  </header>

  <main>
    <div class="card">
      <img src="../atelier-imagen-1.png" alt="Atelier Logo Variante 1">
      <div class="meta">
        <span class="label">Variante 1 · Saturn-Style · 312 KB</span>
        <a class="btn" href="../atelier-imagen-1.png" download="atelier-logo-v1.png">↓ Download</a>
      </div>
    </div>

    <div class="card">
      <img src="../atelier-imagen-2.png" alt="Atelier Logo Variante 2">
      <div class="meta">
        <span class="label">Variante 2 · Spike-Style · 293 KB</span>
        <a class="btn" href="../atelier-imagen-2.png" download="atelier-logo-v2.png">↓ Download</a>
      </div>
    </div>
  </main>

  <footer>
    Workspace CDN · assets.create-app.net · Files liegen unter /atelier/
  </footer>
</body>
</html>
